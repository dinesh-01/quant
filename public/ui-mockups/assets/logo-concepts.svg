<svg viewBox="0 0 780 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Three logomark concepts for Quanta</title>
  <desc>Three abstract marks for the Quanta test-management brand: Orbit Q, Check Orbit, and Q Node, each shown as a violet gradient badge, plus a preview of the recommended mark inside the app's dark sidebar next to the "Quanta / Test Agents" wordmark.</desc>
  <rect x="0" y="0" width="780" height="300" fill="#ffffff"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5efc"/>
      <stop offset="1" stop-color="#9b8cff"/>
    </linearGradient>
  </defs>

  <!-- Badge A: Orbit Q -->
  <rect x="60" y="30" width="96" height="96" rx="22" fill="url(#g1)"/>
  <g transform="translate(85,55) scale(1.9167)">
    <circle cx="11" cy="11" r="6.2" stroke="#fff" stroke-width="2.2" fill="none"/>
    <line x1="15.2" y1="15.2" x2="19.6" y2="19.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="17" cy="4.9" r="1.7" fill="#fff"/>
  </g>
  <text x="108" y="17" text-anchor="middle" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#6d5efc" letter-spacing="0.04em">RECOMMENDED</text>
  <text x="108" y="153" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#3a3f4b">A · Orbit Q</text>

  <!-- Badge B: Check Orbit -->
  <rect x="342" y="30" width="96" height="96" rx="22" fill="url(#g1)"/>
  <g transform="translate(367,55) scale(1.9167)">
    <path d="M6.5,12.5 L10.3,16.3 L18,7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="19.3" cy="5.7" r="1.9" stroke="#fff" stroke-width="1.3" fill="none"/>
    <circle cx="20.9" cy="4.5" r="0.8" fill="#fff"/>
  </g>
  <text x="390" y="153" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#3a3f4b">B · Check Orbit</text>

  <!-- Badge C: Q Node -->
  <rect x="624" y="30" width="96" height="96" rx="22" fill="url(#g1)"/>
  <g transform="translate(649,55) scale(1.9167)">
    <line x1="8.5" y1="9" x2="16" y2="8.3" stroke="#fff" stroke-width="1.1" opacity="0.55"/>
    <line x1="8.5" y1="9" x2="12.3" y2="16.3" stroke="#fff" stroke-width="1.1" opacity="0.55"/>
    <line x1="16" y1="8.3" x2="12.3" y2="16.3" stroke="#fff" stroke-width="1.1" opacity="0.55"/>
    <circle cx="8.5" cy="9" r="3.1" fill="#fff"/>
    <circle cx="16" cy="8.3" r="2.2" fill="#fff" opacity="0.9"/>
    <circle cx="12.3" cy="16.3" r="1.8" fill="#fff" opacity="0.85"/>
  </g>
  <text x="672" y="153" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#3a3f4b">C · Q Node</text>

  <!-- divider -->
  <line x1="60" y1="188" x2="720" y2="188" stroke="#dfe2e8" stroke-width="1"/>
  <text x="60" y="207" font-family="sans-serif" font-size="11" fill="#8890a3">In context — recommended mark (A) at real sidebar scale</text>

  <!-- in-context sidebar strip -->
  <rect x="60" y="215" width="500" height="66" rx="14" fill="#0f1220"/>
  <rect x="88" y="229.25" width="34" height="34" rx="9" fill="url(#g1)"/>
  <g transform="translate(94,235.25) scale(0.99)">
    <circle cx="11" cy="11" r="6.2" stroke="#fff" stroke-width="2.2" fill="none"/>
    <line x1="15.2" y1="15.2" x2="19.6" y2="19.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="17" cy="4.9" r="1.7" fill="#fff"/>
  </g>
  <text x="136" y="242" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffffff">Quanta</text>
  <text x="136" y="259" font-family="sans-serif" font-size="11" fill="#8890a3">Test Agents</text>
</svg>
